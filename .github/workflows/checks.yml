name: checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Pushing again supersedes an unfinished run instead of
# leaving it to occupy runners, and a branch with an open pull request is
# checked once by the pull_request event rather than twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    # The suite takes about three minutes; this only bounds a hang, so that a
    # blocked run fails quickly instead of holding a runner for six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --all-groups --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/build.py
      - run: uv run python scripts/run_packaged_smoke.py
