[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "time-tracker"
dynamic = ["version"]
description = "A local-first, keyboard-driven time tracker"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
  "desktop-notifier",
  "platformdirs",
  "textual",
]

[project.scripts]
time-tracker = "time_tracker.cli:run"

[dependency-groups]
dev = [
  "mypy",
  "pyinstaller",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/time_tracker"]

[tool.hatch.version]
path = "src/time_tracker/__init__.py"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
